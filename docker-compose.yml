# Local development services for Tech Epitome.
#
#   docker compose up -d      start Postgres
#   docker compose down       stop
#   docker compose down -v    stop and wipe the volume
#
# Production uses a managed Postgres; this file is for local work only, which
# is why the credentials are deliberately boring and the port is published.

services:
  postgres:
    image: postgres:18-alpine
    container_name: tech-epitome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: techepitome
      POSTGRES_PASSWORD: techepitome
      POSTGRES_DB: techepitome
      # Deterministic collation so ORDER BY matches production regardless of
      # the host locale.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
    ports:
      - "5432:5432"
    volumes:
      - tech-epitome-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techepitome -d techepitome"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tech-epitome-pgdata:
