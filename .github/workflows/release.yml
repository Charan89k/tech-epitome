# Releases are tags. Building and pushing images is automatic; deploying
# is not: the deploy job uses the "production" environment, which must be
# configured in GitHub with required reviewers so a person approves every
# production change. Secrets are referenced by name only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (for a rollback)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          REPO: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP_URL: ${{ vars.PRODUCTION_APP_URL }}
        run: |
          [ -n "$APP_URL" ] || { echo "vars.PRODUCTION_APP_URL is not set"; exit 1; }
          REPO="${REPO,,}"
          docker build -f deploy/Dockerfile --target app \
            --build-arg NEXT_PUBLIC_APP_URL="$APP_URL" -t "$REPO:$TAG" .
          docker build -f deploy/Dockerfile --target migrator -t "$REPO-migrator:$TAG" .
          docker push "$REPO:$TAG"
          docker push "$REPO-migrator:$TAG"

  deploy:
    needs: [images]
    if: always() && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: production
    concurrency: production-deploy
    steps:
      - name: Release on the server (backup, migrate, health-checked switch, auto rollback)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "invalid tag"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$SSH_HOST" "/opt/tech-epitome/deploy/release.sh '$TAG'"
      - name: Verify from outside
        env:
          APP_URL: ${{ vars.PRODUCTION_APP_URL }}
        run: |
          curl -fsS "$APP_URL/api/health?ready=1"
          curl -fsSI "$APP_URL/" | grep -i '^strict-transport-security'
