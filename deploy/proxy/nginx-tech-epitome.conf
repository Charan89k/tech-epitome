# UNUSED on the current server: the VPS runs Caddy in Docker, not nginx.
# Kept only as an alternative for a host that uses nginx; the live
# instructions are deploy/proxy/Caddyfile.snippet.
# Tech Epitome on an existing nginx. A new server block for the new domain
# only; existing server blocks are not edited. Replace TE_DOMAIN.
# Certificates: certbot --nginx -d TE_DOMAIN (issues for this name only).

server {
    listen 80;
    listen [::]:80;
    server_name TE_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name TE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/TE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    # The app sets HSTS, CSP and the other security headers itself.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Tutor and interview answers stream (server-sent events).
    location ~ ^/api/(tutor|interview)/stream$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Scheduled jobs are called from the server itself, never from outside.
    location /api/cron/ { return 404; }
}
